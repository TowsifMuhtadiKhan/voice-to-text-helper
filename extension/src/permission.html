<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allow Microphone — Universal Voice-to-Text Helper</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #09090b;
        color: #f4f4f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .card {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 16px;
        padding: 36px 32px;
        max-width: 440px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      .icon-wrap {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px auto;
        background: #2563eb;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        box-shadow: 0 0 24px rgba(37, 99, 235, 0.5);
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 10px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        color: #a1a1aa;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .allow-btn {
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background 0.15s ease;
      }
      .allow-btn:hover {
        background: #1d4ed8;
      }
      .success-box {
        display: none;
        background: rgba(34, 197, 94, 0.15);
        border: 1px solid #22c55e;
        color: #86efac;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-wrap">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="23" />
          <line x1="8" y1="23" x2="16" y2="23" />
        </svg>
      </div>

      <h1>Microphone Access Required</h1>
      <p id="prompt-desc">
        Click the button below and select <strong>&quot;Allow&quot;</strong> on the browser prompt so the extension can convert your voice into text.
      </p>

      <button id="ask-btn" class="allow-btn">Allow Microphone Access</button>
      <div id="success-box" class="success-box">✓ Microphone allowed! You can close this tab now.</div>
    </div>

    <script src="permission.js"></script>
  </body>
</html>
