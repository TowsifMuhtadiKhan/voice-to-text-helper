<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Voice-to-Text Helper — Test Page</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 760px;
        margin: 32px auto;
        padding: 0 20px;
        background: #0f172a;
        color: #f8fafc;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 8px;
      }
      p.desc {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 24px;
      }
      .field-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #cbd5e1;
      }
      input[type="text"],
      textarea,
      .rich-editor {
        width: 100%;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #f8fafc;
        font-size: 14px;
        font-family: inherit;
        box-sizing: border-box;
      }
      input[type="text"]:focus,
      textarea:focus,
      .rich-editor:focus {
        outline: 2px solid #3b82f6;
        border-color: transparent;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      .rich-editor {
        min-height: 100px;
      }
    </style>
  </head>
  <body>
    <h1>Universal Voice-to-Text Helper — Test Page</h1>
    <p class="desc">
      Click inside any field below, activate dictation (via popup, desktop app, or
      <code>Ctrl+Shift+Space</code>), and speak to insert text at the cursor.
    </p>

    <div class="field-group">
      <label for="test-input">1. Standard Text Input (&lt;input type="text"&gt;)</label>
      <input
        id="test-input"
        type="text"
        placeholder="Place cursor here and speak..."
        value="Initial text."
      />
    </div>

    <div class="field-group">
      <label for="test-textarea">2. Multi-line Textarea (&lt;textarea&gt;)</label>
      <textarea id="test-textarea" placeholder="Place cursor here and speak...">First paragraph.</textarea>
    </div>

    <div class="field-group">
      <label for="test-rich">3. Rich-Text Editor (contenteditable="true")</label>
      <div id="test-rich" class="rich-editor" contenteditable="true">Editable rich text area.</div>
    </div>
  </body>
</html>
